<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Wanderlost</title>
    <!--
      Plain static HTML, not a Next.js route: Serwist's precache-fallback
      plugin can only serve a URL that was itself precached at build time
      (see PrecacheFallbackPlugin.handlerDidError — it calls matchPrecache,
      never the runtime cache), and only files physically under public/ are
      swept into that precache manifest. A rendered App Router page isn't
      one of those files, so this has to be a real static file to work at
      all when truly offline. Inline styles (raw hex, not tokens) are the
      one place that's fine — this file is served straight from the SW
      cache with no build pipeline to read CSS variables.
    -->
    <style>
      html, body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6eedf;
        color: #122a3a;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #3e5566;
        line-height: 1.5;
      }
      a {
        color: #0f5c5c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline reading yet. Your trips and
        passport that you've already opened are still available —
        <a href="/trips">try My Trips</a> or <a href="/passport">your
        passport</a> instead. Everything will sync again once you're back
        online.
      </p>
    </div>
  </body>
</html>
